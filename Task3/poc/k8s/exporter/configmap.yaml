apiVersion: v1
kind: ConfigMap
metadata:
  name: exporter-config
  namespace: shipping
data:
  # --- PostgreSQL ---
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: shipping
  DB_SSLMODE: disable
  # --- Export ---
  TABLE_NAME: shipments
  EXPORT_GZIP: "false"
  TZ: Europe/Moscow
  RETRY_COUNT: "30"
  RETRY_DELAY_SECONDS: "5"
  # --- Object storage (MinIO) ---
  S3_ENDPOINT: minio:9000
  S3_BUCKET: analytics
  S3_REGION: us-east-1
  S3_USE_SSL: "false"
  S3_PREFIX: shipments
